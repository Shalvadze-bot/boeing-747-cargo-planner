name: Build and deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE_PATH: /boeing-747-cargo-planner/
      - run: node --test tests/*.test.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # A legacy branch-based Pages publisher can otherwise overwrite the Vite
      # build. Settings -> Pages -> Source should still be GitHub Actions.
      - name: Wait for legacy Pages publisher
        uses: actions/github-script@v7
        with:
          script: |
            for (let attempt = 0; attempt < 120; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                ...context.repo, head_sha: context.sha, per_page: 100
              });
              const legacy = data.workflow_runs.filter(run =>
                run.id !== context.runId && run.path === 'dynamic/pages/pages-build-deployment'
              );
              if (legacy.length && legacy.every(run => run.status === 'completed')) {
                core.info('Legacy Pages publisher has finished; deploying the built application last.');
                return;
              }
              if (!legacy.length && attempt >= 11) {
                core.info('No legacy Pages publisher appeared for this commit.');
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            core.setFailed('Legacy Pages publisher did not finish. Set Pages Source to GitHub Actions, then rerun this deploy job.');
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
